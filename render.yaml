services:
  - type: web
    name: fixit-api
    env: node
    plan: starter
    buildCommand: npm install --prefix backend --no-audit --no-fund
    startCommand: node backend/src/index.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: FIXIT_AI_PROVIDER
        value: stub
      - key: OPENAI_API_KEY
        sync: false
      - key: REVENUECAT_API_KEY
        sync: false
